# Generated gh-aw workflows are updated by regeneration, not standalone action pin bumps.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    ignore:
      - dependency-name: github/gh-aw-actions/setup
    exclude-paths:
      - .github/workflows/*.lock.yml
  - package-ecosystem: npm
    directory: /.github/commitlint
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    groups:
      commitlint:
        patterns:
          - '*'
