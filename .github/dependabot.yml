# gh-aw setup and generated runtime lockfiles must be regenerated as a matched set.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
    ignore:
      - dependency-name: github/gh-aw-actions/setup
